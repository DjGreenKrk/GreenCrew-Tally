; GC Tally firmware v2: C++ for ESP8266, a drop-in replacement for the
; NodeMCU/Lua firmware in tally/. See README.md.

[platformio]
default_envs = d1_mini

[common]
firmware_version = 2.0.0-dev

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
; 1 MB for LittleFS (tally-settings.ini), the rest for the sketch and,
; later, room for an OTA image (#30)
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
lib_deps = makuna/NeoPixelBus@2.8.4
build_flags = -DGC_FIRMWARE_VERSION=\"${common.firmware_version}\"
monitor_speed = 115200
upload_speed = 460800
test_ignore = *

; The tally logic without hardware, for unit tests on the computer:
; pio test -e native
[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -DGC_FIRMWARE_VERSION=\"${common.firmware_version}\"
lib_ignore = NeoPixelBus
