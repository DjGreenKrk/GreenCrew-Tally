name: Hub Node 24 migration probe

on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - 'hub/package.json'
      - 'hub/package-lock.json'
      - 'hub/tsconfig*.json'
      - 'hub/src/server.ts'
      - 'hub/src/flasher/**'
      - 'hub/src/mixer/**'
      - 'hub/src/tally/**'
      - 'hub/src/lib/**'
      - 'hub/scripts/package-windows.js'
      - '.github/workflows/hub-node24-probe.yml'
  workflow_dispatch:

jobs:
  node24-compatibility:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: hub
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record environment
        run: |
          node --version
          npm --version
          python --version
      - name: Install legacy dependency tree on Node 24
        run: npm ci --legacy-peer-deps --foreground-scripts
      - name: Run Hub unit tests
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --runInBand
      - name: Compile Hub backend
        run: npm run build:backend
      - name: Compile experimental Vite frontend
        run: npm run build:frontend
      - name: Verify Vite bundle output
        run: node scripts/check-vite-output.cjs
      - name: Verify SPA routes over HTTP
        run: node scripts/check-vite-preview.cjs
      # Deliberately no pkg/EXE step: pkg targets Node 16 and native
      # serialport/NodeMCU compatibility needs to be established first.
