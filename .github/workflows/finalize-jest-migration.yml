name: Finalize standalone Jest migration

on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - '.github/workflows/finalize-jest-migration.yml'
      - 'hub/src/lib/DisconnectedClientSideSocket.ts'
      - 'hub/src/hooks/useSocket.ts'
      - 'hub/src/hooks/tracker/**'
      - 'hub/vite.config.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Replace CRA with locked standalone Jest dependencies
        run: |
          npm uninstall --save-dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund react-scripts
          npm install --save-dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund --save-exact jest@29.7.0 jest-environment-jsdom@29.7.0 babel-jest@29.7.0 @babel/preset-env@7 @babel/preset-react@7 @babel/preset-typescript@7 identity-obj-proxy@3
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts.test = 'jest --config jest.standalone.cjs';
          p.scripts['test:ci'] = 'jest --config jest.standalone.cjs --watch=false --runInBand';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          printf '/// <reference types="vite/client" />\n' > src/react-app-env.d.ts
      - name: Verify reproducible install
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Run all 276 Jest tests
        run: npm run test:ci
      - name: Build backend and Vite frontend
        run: |
          npm run build:backend
          npm run build:frontend
          npm run test:frontend:smoke
      - name: Commit dependency migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/package.json hub/package-lock.json hub/src/react-app-env.d.ts
          if ! git diff --cached --quiet; then
            git commit -m "build: replace CRA test runner with standalone Jest on Node 24"
            git push
          fi
