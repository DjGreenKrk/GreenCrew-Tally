name: E2 safe ESLint autofix with full test regression
on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - '.github/workflows/modernization-e2-lint-autofix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Clean reproducible npm install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply only automatically fixable ESLint recommendations
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/eslint . --fix --output-file /tmp/e2-autofix-remaining.txt
          code=$?
          set -e
          cat /tmp/e2-autofix-remaining.txt
          echo "Remaining lint check exit after autofix: $code" >> "$GITHUB_STEP_SUMMARY"
          echo 'Remaining lint findings are NOT declared clean and remain gated by E2 diagnostics.' >> "$GITHUB_STEP_SUMMARY"
      - name: Regression guard on changed sources
        run: |
          npm run build:backend
          npm run build:frontend
          npx tsc --project tsconfig.test.json --noEmit
          npm run test:ci
      - name: Commit only verified automatic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- src scripts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(e2): apply ESLint autofix without rule suppression"
            git push origin HEAD:refs/heads/feat/node24-modernization-poc
          fi
