name: E1 explicit native addons inside isolated Windows EXE
on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - 'hub/scripts/check-pkg-native-assets.cjs'
      - '.github/workflows/modernization-pkg-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-in-exe:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and execute unpackaged-dir native EXE with documented pkg assets
        run: node hub/scripts/check-pkg-native-assets.cjs
      - name: Preserve evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-windows-native-asset-proof
          path: hub/dist/e1-pkg-assets/results.json
          if-no-files-found: error
