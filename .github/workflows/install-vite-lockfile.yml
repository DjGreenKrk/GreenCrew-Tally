name: Install Vite and update lockfile

on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - '.github/workflows/install-vite-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.ref == 'refs/heads/feat/node24-modernization-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Generate reproducible Vite dependency lockfile
        working-directory: hub
        run: npm install --save-dev --save-exact vite@6.4.4 --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify dependency is locally installed
        working-directory: hub
        run: |
          node -e "const p=require('./package.json'); if(p.devDependencies.vite!=='6.4.4') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if(!p.packages?.['node_modules/vite']) process.exit(1)"
          ./node_modules/.bin/vite --version
      - name: Commit lockfile and package manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub/package.json hub/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already synchronized"
            exit 0
          fi
          git commit -m "build: install Vite 6.4.4 and refresh npm lockfile"
          git push origin HEAD:feat/node24-modernization-poc
