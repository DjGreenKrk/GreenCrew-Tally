name: Modernization real Hub HTTP Socket.IO UDP integration
on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - 'hub/src/**'
      - 'hub/scripts/check-live-companion-integration.cjs'
      - '.github/workflows/modernization-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Baseline install (temporary old React peer conflict)
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Compile running backend
        run: npm run build:backend
      - name: Live Hub and UDP acceptance
        run: node scripts/check-live-companion-integration.cjs
