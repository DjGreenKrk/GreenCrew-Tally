name: Probe standalone Jest migration

on:
  push:
    branches: [feat/node24-modernization-poc]
    paths:
      - '.github/workflows/jest-migration-probe.yml'
  workflow_dispatch:

jobs:
  jest-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Install standalone Jest toolchain
        run: npm install --no-save --legacy-peer-deps --ignore-scripts --no-audit --no-fund jest@29.7.0 jest-environment-jsdom@29.7.0 babel-jest@29.7.0 @babel/preset-env@7 @babel/preset-react@7 @babel/preset-typescript@7 identity-obj-proxy@3
      - name: Run Jest independent of react-scripts
        run: npx --no-install jest --config jest.standalone.cjs --watch=false --runInBand
